{% include base_path %}

<!-- start custom head snippets -->

<!-- Apply the saved or system colour theme before first paint to avoid a light flash in dark mode -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      if (t === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
    } catch (e) {}
  })();
</script>

<!-- Fonts: Inter (body) and Source Serif 4 (headings) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">

<!-- Academicons (self-hosted copy in /assets) -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.min.css">

<!-- Support for Font Awesome -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Favicons -->
<link rel="icon" href="{{ base_path }}/images/favicon.ico" sizes="any"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#1f6f5c" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0f1916" media="(prefers-color-scheme: dark)"/>

<!-- end custom head snippets -->
